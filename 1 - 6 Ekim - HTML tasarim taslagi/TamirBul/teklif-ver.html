<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teklif Ver - TamirBul</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <div class="container navbar-container">
            <a href="index.html" class="logo">
                <h1>Tamir<span>Bul</span></h1>
            </a>
            <nav class="nav-menu">
                <ul>
                    <li><a href="tamirci-paneli.html">Tamirci Paneli</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="auth-section">
        <div class="container auth-container">
            <div class="auth-card">
                <h2>Arıza Talebine Teklif Gönder</h2>
                <p class="auth-subtitle">Müşteriye net fiyat ve tahmini teslim süresi belirterek teklifinizi iletin.</p>

                <form id="formTeklifGonder" action="#" method="POST">
                    <div class="form-group">
                        <label for="txtTeklifFiyat">Teklif Tutarı (TL)</label>
                        <input type="number" id="txtTeklifFiyat" name="fiyat" placeholder="Örn: 1500" required>
                    </div>

                    <div class="form-group">
                        <label for="txtTahminiSure">Tahmini Tamir Süresi</label>
                        <input type="text" id="txtTahminiSure" name="sure" placeholder="Örn: 1 İş Günü / Aynı Gün" required>
                    </div>

                    <div class="form-group">
                        <label for="txtTeklifNotu">Teklif Açıklaması / Garanti Detayı</label>
                        <textarea id="txtTeklifNotu" name="not" placeholder="Orijinal parça kullanılacaktır, 6 ay garantilidir..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Teklifi Onaya Gönder</button>
                </form>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container footer-container">
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
