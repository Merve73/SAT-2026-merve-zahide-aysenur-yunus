<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Müşteri Kaydı - TamirBul</title>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <div class="container navbar-container">
            <a href="index.html" class="logo">
                <h1>🔧 Tamir<span>Bul</span></h1>
            </a>
            <nav class="nav-menu">
                <ul>
                    <li><a href="index.html">Ana Sayfa</a></li>
                    <li><a href="giris.html">Giriş Yap</a></li>
                    <li><a href="tamirci-kayit.html">Tamirci Katıl</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="auth-section">
        <div class="container auth-container">
            <div class="auth-card">
                <h2>Müşteri Hesabı Oluştur</h2>
                <p class="auth-subtitle">Arızalı cihazın için hızlıca teklif topla ve tamirciyi seç.</p>

                <form id="formMusteriKayit" action="#" method="POST">
                    
                    <div class="form-group">
                        <label for="txtAdSoyad">Adınız Soyadınız</label>
                        <input 
                            type="text" 
                            id="txtAdSoyad" 
                            name="ad_soyad" 
                            placeholder="Örn: Ahmet Yılmaz" 
                            required>
                    </div>

                    <div class="form-group">
                        <label for="txtEposta">E-Posta Adresi</label>
                        <input 
                            type="email" 
                            id="txtEposta" 
                            name="eposta" 
                            placeholder="ornek@email.com" 
                            required>
                    </div>

                    <div class="form-group">
                        <label for="txtTelefon">Telefon Numarası</label>
                        <input 
                            type="tel" 
                            id="txtTelefon" 
                            name="telefon" 
                            placeholder="05XXXXXXXXX" 
                            required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="cmbIl">İl</label>
                            <select id="cmbIl" name="il_id" required>
                                <option value="">İl Seçiniz</option>
                                <option value="1">Adana</option>
                                <option value="6">Ankara</option>
                                <option value="7">Antalya</option>
                                <option value="16">Bursa</option>
                                <option value="34">İstanbul</option>
                                <option value="35">İzmir</option>
                                <option value="38">Kayseri</option>
                                <option value="46">Kahramanmaraş</option>
                                <option value="66">Yozgat</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="cmbIlce">İlçe</label>
                            <select id="cmbIlce" name="ilce_id" required disabled>
                                <option value="">Önce İl Seçiniz</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="txtSifre">Şifre</label>
                        <input 
                            type="password" 
                            id="txtSifre" 
                            name="sifre" 
                            placeholder="******" 
                            required>
                    </div>

                    <div class="form-group">
                        <label for="txtSifreTekrar">Şifre Tekrarı</label>
                        <input 
                            type="password" 
                            id="txtSifreTekrar" 
                            name="sifreTekrar" 
                            placeholder="******" 
                            required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" id="btnMusteriKayitOl">Kayıt Ol</button>
                </form>

                <div class="auth-footer">
                    <p>Zaten bir hesabınız var mı? <a href="giris.html" class="link-primary">Giriş Yap</a></p>
                </div>

            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container footer-container">
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
