<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - TamirBul</title>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <div class="container navbar-container">
            <a href="index.html" class="logo">
                <h1>🔧 Tamir<span>Bul</span></h1>
            </a>
            <nav class="nav-menu">
                <ul>
                    <li><a href="index.html">Ana Sayfa</a></li>
                    <li><a href="musteri-kayit.html">Müşteri Ol</a></li>
                    <li><a href="tamirci-kayit.html">Tamirci Katıl</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="auth-section">
        <div class="container auth-container">
            <div class="auth-card">
                <h2>Hesabınıza Giriş Yapın</h2>
                <p class="auth-subtitle">Teklifleri görmek veya tamir talebi oluşturmak için giriş yapın.</p>

                <form id="formGiris" action="#" method="POST">
                    
                    <div class="form-group">
                        <label for="txtEposta">E-Posta Adresi</label>
                        <input 
                            type="email" 
                            id="txtEposta" 
                            name="eposta" 
                            placeholder="ornek@email.com" 
                            required>
                    </div>

                    <div class="form-group">
                        <label for="txtSifre">Şifre</label>
                        <input 
                            type="password" 
                            id="txtSifre" 
                            name="sifre" 
                            placeholder="******" 
                            required>
                    </div>

                    <div class="form-actions-row">
                        <label class="remember-me">
                            <input type="checkbox" id="chkBeniHatirla" name="beniHatirla">
                            <span>Beni Hatırla</span>
                        </label>
                        <a href="#" class="forgot-password">Şifremi Unuttum?</a>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" id="btnGirisYap">Giriş Yap</button>
                </form>

                <div class="auth-footer">
                    <p>Hesabınız yok mu?</p>
                    <div class="register-links">
                        <a href="musteri-kayit.html" class="link-primary">Müşteri Kaydı Aç</a>
                        <span>|</span>
                        <a href="tamirci-kayit.html" class="link-secondary">Tamirci Olarak Katıl</a>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container footer-container">
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
